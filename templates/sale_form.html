{% extends 'layout.html' %}{% block content %}<form class="panel form-card" id="sale-form" method="post"><div class="form-grid"><label>Product<select id="sale-product" name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} ({{ p.current_stock }} {{ p.unit }})</option>{% endfor %}</select></label><label>Date<input id="sale-date" type="date" name="sale_date" max="{{ now_date if now_date else '' }}" required></label><div class="full"><small id="suggestion-message" class="muted">Suggested Quantity Based on Previous Sales: <span id="suggestion-value">Not available yet.</span></small><p class="muted">The suggested value is guidance only. Confirm the actual quantity sold before saving.</p></div><label>Quantity Sold<input id="sale-quantity" type="number" min="0.01" step="0.01" name="quantity" required></label><label>Selling Price (optional)<input type="number" min="0" step="0.01" name="selling_price"></label><label>Customer / Buyer<input name="buyer"></label><label>Notes<input name="notes"></label></div><button class="primary" type="submit">Save Sale</button> <a class="button" href="{{ url_for('sales_page') }}">Cancel</a></form><script>const productSelect=document.getElementById('sale-product'),dateInput=document.getElementById('sale-date'),message=document.getElementById('suggestion-message'),quantity=document.getElementById('sale-quantity'),suggestionValue=document.getElementById('suggestion-value'),saleForm=document.getElementById('sale-form');dateInput.value=new Date().toISOString().slice(0,10);dateInput.max=dateInput.value;const todayIso = dateInput.value;async function loadSuggestion(){try{const r=await fetch('/api/sales/suggestion/'+productSelect.value);const b=await r.json();if(b.available){const suggested = Number(b.suggested_quantity).toFixed(2);suggestionValue.textContent = suggested + ' ' + b.unit;quantity.value = suggested;}else{suggestionValue.textContent = 'Not available';}}catch(e){suggestionValue.textContent = 'Not available';}}productSelect.addEventListener('change',loadSuggestion);dateInput.addEventListener('change',loadSuggestion);saleForm.addEventListener('submit', (event) => { const selectedDate = dateInput.value; if (selectedDate && selectedDate > todayIso) { event.preventDefault(); alert('Sales can only be recorded for today or a previous date.'); }});loadSuggestion();</script>{% endblock %}
