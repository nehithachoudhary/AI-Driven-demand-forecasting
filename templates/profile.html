{% extends 'layout.html' %}{% block content %}<form class="panel form-card" method="post"><div class="form-grid"><label>Full Name<input name="full_name" value="{{ g.user['full_name'] }}" required></label><label>Email<input value="{{ g.user['email'] }}" readonly></label><label>Mobile Number<input name="phone" value="{{ g.user['phone'] }}" required></label><label>Business Name<input name="business_name" value="{{ g.user['business_name'] }}" required></label><label>Address<input name="address" value="{{ g.user['address'] }}" required></label><label>City<input name="city" value="{{ g.user['city'] }}" required></label><label>State<input name="state" value="{{ g.user['state'] }}" required></label><label>Region<input name="region" value="{{ g.user['region'] }}" required></label></div><h3>Account recovery</h3><p class="muted">Add recovery information if this account was created before recovery was introduced.</p><div class="form-grid"><label>Security Question<select name="security_question"><option value="">Keep current recovery information</option>{% for question in security_questions %}<option value="{{ question }}" {% if g.user['security_question'] == question %}selected{% endif %}>{{ question }}</option>{% endfor %}</select></label><label>Security Answer<input name="security_answer" autocomplete="off"></label></div><button class="primary" type="submit">Save Profile</button></form>{% endblock %}
