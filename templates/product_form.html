{% extends 'layout.html' %}{% block content %}<form class="panel form-card" method="post"><div class="form-grid"><label>Product Name<input name="name" value="{{ product['name'] if product else '' }}" required></label><label>Category<input name="category" value="{{ product['category'] if product else '' }}"></label><label>Unit<input name="unit" value="{{ product['unit'] if product else '' }}" placeholder="kg, box, piece" required></label><label>Region<input name="region" value="{{ product['region'] if product else g.user['region'] }}" required></label><label>Current Stock<input type="number" min="0" step="0.01" name="current_stock" value="{{ product['current_stock'] if product else 0 }}" {% if product %}readonly{% endif %} required></label><label>Safety Stock<input type="number" min="0" step="0.01" name="safety_stock" value="{{ product['safety_stock'] if product else 0 }}" required></label><label>Lead Time (days)<input type="number" min="0" name="lead_time_days" value="{{ product['lead_time_days'] if product else 7 }}" required></label><label class="full">Description<textarea name="description">{{ product['description'] if product else '' }}</textarea></label></div><button class="primary" type="submit">Save Product</button> <a class="button" href="{{ url_for('products_page') }}">Cancel</a></form>{% endblock %}
