{% extends 'layout.html' %}{% block content %}
<section class="settings-shell">
  <header class="settings-intro"><p class="eyebrow">ACCOUNT SECURITY</p><h2>Change Password</h2><p class="muted">Verify your current password before choosing a new one.</p></header>
  <form class="panel form-card password-form" method="post">
    <div class="form-grid">
      <label>Current Password<input name="current_password" type="password" autocomplete="current-password" required></label>
      <label>New Password<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm New Password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></label>
    </div>
    <div class="form-actions"><button class="primary" type="submit">Update Password</button><a class="button" href="{{ url_for('settings') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
