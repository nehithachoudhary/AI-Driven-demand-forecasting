<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStock AI | Forgot Password</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body class="auth-page"><form class="auth-card" id="recovery-form"><p class="eyebrow">ACCOUNT RECOVERY</p><h2>Forgot Password</h2><p class="muted">Verify your registered account details to reset your password.</p><div id="recovery-message" class="flash error" hidden></div><section id="account-step"><label>Email<input id="recovery-email" type="email" autocomplete="email" required></label><label>Mobile Number<input id="recovery-phone" autocomplete="tel" required></label><button class="primary" id="account-button" type="submit">Verify Account</button></section><section id="answer-step" hidden><label>Security Question<input id="recovery-question" readonly></label><label>Security Answer<input id="recovery-answer" autocomplete="off"></label><button class="primary" id="answer-button" type="button">Verify Answer</button></section><p class="center muted"><a href="{{ url_for('login') }}">Back to Login</a></p></form><script>
(() => {const form=document.getElementById('recovery-form'),message=document.getElementById('recovery-message'),accountStep=document.getElementById('account-step'),answerStep=document.getElementById('answer-step'),answerInput=document.getElementById('recovery-answer'),accountButton=document.getElementById('account-button'),answerButton=document.getElementById('answer-button');const show=text=>{message.textContent=text;message.hidden=!text;};const call=async(url,payload)=>{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const text=await response.text();let body={};try{body=text?JSON.parse(text):{};}catch(error){throw new Error('The recovery service returned an invalid response.');}if(!response.ok)throw new Error(body.error||body.message||'Verification failed');return body;};form.addEventListener('submit',async event=>{event.preventDefault();accountButton.disabled=true;accountButton.textContent='Verifying...';show('');try{const body=await call('/api/recovery/account',{email:document.getElementById('recovery-email').value,phone:document.getElementById('recovery-phone').value});document.getElementById('recovery-question').value=body.security_question;accountStep.hidden=true;answerStep.hidden=false;answerInput.required=true;answerInput.focus();}catch(error){show(error.message);}finally{accountButton.disabled=false;accountButton.textContent='Verify Account';}});answerButton.addEventListener('click',async()=>{if(!answerInput.value.trim()){show('Enter your security answer.');answerInput.focus();return;}answerButton.disabled=true;answerButton.textContent='Verifying...';show('');try{await call('/api/recovery/verify',{security_answer:answerInput.value});window.location.href='/reset-password';}catch(error){show(error.message);answerButton.disabled=false;answerButton.textContent='Verify Answer';}});})();
</script></body></html>
