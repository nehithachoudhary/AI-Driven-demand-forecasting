{% extends 'layout.html' %}{% block content %}<form class="panel form-card" method="post"><div class="form-grid"><label>Product<select name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} ({{ p.current_stock }} {{ p.unit }})</option>{% endfor %}</select></label><label>Date<input id="stock-date" type="date" name="stock_date" required></label><label>Quantity Received<input type="number" name="quantity" min="0.01" step="0.01" required></label><label>Supplier (optional)<input name="supplier"></label><label class="full">Notes<input name="notes"></label></div><button class="primary" type="submit">Save Stock-In</button> <a class="button" href="{{ url_for('inventory_page') }}">Cancel</a></form><script>const d=document.getElementById('stock-date');d.value=new Date().toISOString().slice(0,10);d.max=d.value;</script>{% endblock %}
