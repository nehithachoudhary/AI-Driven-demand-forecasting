<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStock AI | Reset Password</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body class="auth-page"><form class="auth-card" id="reset-form"><p class="eyebrow">ACCOUNT RECOVERY</p><h2>Reset Password</h2><p class="muted">Choose a new password for your account.</p><div id="reset-message" class="flash error" hidden></div><label>New Password<input id="new-password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm Password<input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary" id="reset-button" type="submit">Update Password</button><p class="center muted"><a href="{{ url_for('login') }}">Back to Login</a></p></form><script>
document.getElementById('reset-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('reset-button'),message=document.getElementById('reset-message');button.disabled=true;button.textContent='Updating...';message.hidden=true;try{const response=await fetch('/api/recovery/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_password:document.getElementById('new-password').value,confirm_password:document.getElementById('confirm-password').value})});const body=await response.json();if(!response.ok)throw new Error(body.error||'Password reset failed');message.className='flash success';message.textContent=body.message;message.hidden=false;button.textContent='Updated';setTimeout(()=>{window.location.href='/login';},900);}catch(error){message.className='flash error';message.textContent=error.message;message.hidden=false;button.disabled=false;button.textContent='Update Password';}});
</script></body></html>
